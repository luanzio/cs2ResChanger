name: build-and-release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch: {}

permissions:
    contents: write

jobs:
    windows-build:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Install deps
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Build EXE
              shell: pwsh
              run: >
                  pyinstaller --noconsole --onefile --name CS2ResChanger
                  --icon assets/cs2.ico --add-data "assets/cs2.ico;assets" main.py

            # O usuario precisa do daemon junto com o .exe: sozinho o app so
            # escreve arquivos, quem aplica a resolucao e o .ps1.
            - name: Package
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force dist/pacote | Out-Null
                  Copy-Item dist/CS2ResChanger.exe dist/pacote/
                  Copy-Item cs2-resolucao.ps1, cs2-resolucao.vbs, README.md, CHANGELOG.md dist/pacote/
                  Compress-Archive -Path dist/pacote/* -DestinationPath dist/CS2ResChanger-win64.zip -Force

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: CS2ResChanger-win64
                  path: dist/CS2ResChanger-win64.zip

            - name: Create GitHub Release
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      dist/CS2ResChanger-win64.zip
                      dist/CS2ResChanger.exe
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
